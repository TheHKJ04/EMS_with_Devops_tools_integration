services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: ems-blackbox-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/blackbox.yml"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    mem_limit: 96m
    cpus: 0.25
    networks:
      - ems-network


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ems-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    mem_limit: 256m
    cpus: 0.25
    networks:
      - ems-network
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ems-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ems-prometheus-data:/prometheus
    mem_limit: 384m
    cpus: 0.50
    depends_on:
      - blackbox-exporter
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ems-network

  grafana:
    image: grafana/grafana:12.1.1
    container_name: ems-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ems-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 512m
    cpus: 0.50
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - ems-network

networks:
  ems-network:
    external: true
    name: employee-management-system_devops_default

volumes:
  ems-prometheus-data:
    name: employee-management-system_devops_ems-prometheus-data
  ems-grafana-data:
    name: employee-management-system_devops_ems-grafana-data
