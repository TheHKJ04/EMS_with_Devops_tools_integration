{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4 border-0 text-center">
                <h3 class="mb-3">Account Registration Disabled</h3>

                <p class="text-muted mb-0">
                    Administrator accounts are configured securely
                    through application deployment settings.
                    Please contact the system administrator
                    if you require access.
                </p>

                <a href="{{ url_for('auth.login') }}"
                   class="btn btn-dark mt-4">
                    Go to Admin Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
