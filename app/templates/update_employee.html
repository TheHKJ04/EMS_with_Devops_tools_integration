{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Update Employee</h4>
                </div>
                <div class="card-body p-4">
                    <form action="/employee/employeeUpdate/{{ employee.id }}" method="POST" class="row g-3">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" value="{{ employee.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ employee.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" name="department" value="{{ employee.department }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Employee Password</label>
                            <input type="password" class="form-control" name="password" placeholder="Leave blank to keep the current password">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Position</label>
                            <input type="text" class="form-control" name="position" value="{{ employee.position }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date of Joining</label>
                            <input type="date" class="form-control" name="date_of_joining" value="{{ employee.date_of_joining }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Active" {% if employee.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Inactive" {% if employee.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Salary</label>
                            <input type="number" step="0.01" class="form-control" name="salary" value="{{ employee.salary }}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Update Note </label>
                            <textarea class="form-control" name="update_message" rows="3" placeholder="Explain the change or reason for the update" required></textarea>
                        </div>
                        <div class="col-12 d-flex justify-content-end gap-2">
                            <button type="submit" class="btn btn-success">Update</button>
                            <a href="/employee/list" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
