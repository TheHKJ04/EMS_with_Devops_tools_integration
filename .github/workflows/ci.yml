name: EMS Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ems-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python validation, SAST and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies and Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile application
        run: python -m compileall -q app app.py wsgi.py

      - name: Static application security test
        run: bandit -r app -ll

      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Check for application test files
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            -not -path './.git/*' \
            -not -path './venv/*' \
            -not -path './.venv/*' \
            | grep -q .; then
            echo "Test files detected; review and run the project test suite."
          else
            echo "::warning::No pytest test files found. Automated application tests are not yet configured."
          fi

      - name: Build Docker image
        run: docker build -t ems-ci:${{ github.sha }} .
